name: CI

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check server.js

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ragChatbot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ragChatbot/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://rag-chatbot-api-72h9.onrender.com
